[project]
name = "courtroom-engine"
version = "0.1.0"
description = "V2 courtroom intelligence engine domain, policy, context, and reusable service package."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
